# BITE.co local reverse-proxy
# Single entry point on :8080 — mirrors the public ALB path structure in AWS (CHANGE 6).
#
# Route map (paths forwarded AS-IS to each backend, same as ALB behavior):
#   /auth/      → manejador_autenticacion:8004   (JWT login, refresh, validate)
#   /projects   → manejador_usuarios:8001         (project CRUD)
#   /cloud/     → manejador_cloud:8002            (cloud accounts, resources, metrics)
#   /events     → manejador_reportes:8003         (batch events, analytics, reports)
#   /security   → manejador_seguridad:8005        (RBAC / security policies)
#   /           → static frontend files

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # ── Upstream definitions ───────────────────────────────────────────────
    upstream auth_service {
        server manejador_autenticacion:8004;
        keepalive 8;
    }
    upstream usuarios_service {
        server manejador_usuarios:8001;
        keepalive 8;
    }
    upstream cloud_service {
        server manejador_cloud:8002;
        keepalive 16;
    }
    upstream reportes_service {
        server manejador_reportes:8003;
        keepalive 8;
    }
    upstream seguridad_service {
        server manejador_seguridad:8005;
        keepalive 4;
    }

    server {
        listen 8080;
        server_name localhost;

        # Common proxy headers
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        # ── /auth/ → manejador_autenticacion ──────────────────────────────
        # CHANGE 6: path forwarded AS-IS (no prefix stripping).
        # index.html now calls CONFIG.AUTH_URL/login = /auth/login
        # Backend Django URL: auth/login → matches /auth/login ✓
        location /auth/ {
            proxy_pass http://auth_service;
        }

        # ── /projects → manejador_usuarios ────────────────────────────────
        # dashboard calls CONFIG.USUARIOS_URL = /projects
        # Keeps full path: /projects → manejador_usuarios:8001/projects
        location /projects {
            proxy_pass http://usuarios_service;
        }

        # ── /cloud/ → manejador_cloud ─────────────────────────────────────
        # CHANGE 3: added for manejador_cloud FastAPI (PROMPT 4)
        # dashboard calls CONFIG.CLOUD_URL/cloud-accounts = /cloud/cloud-accounts
        # Keeps full path: /cloud/cloud-accounts → manejador_cloud:8002/cloud/cloud-accounts
        location /cloud/ {
            proxy_pass http://cloud_service/cloud/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── /events → manejador_reportes ──────────────────────────────────
        location /events {
            proxy_pass http://reportes_service;
        }

        # ── /security → manejador_seguridad ───────────────────────────────
        location /security {
            proxy_pass http://seguridad_service;
        }

        # ── /health → nginx self-check ─────────────────────────────────────
        location = /health {
            access_log off;
            return 200 '{"status":"ok","service":"nginx"}';
            add_header Content-Type application/json;
        }

        # ── / → serve static frontend files ───────────────────────────────
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
