<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BITE.co — Login</title>
  <script src="config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }
    
    /* Background animated elements */
    .bg-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      animation: float 10s infinite ease-in-out alternate;
    }
    .shape1 {
      width: 400px; height: 400px;
      background: rgba(67, 97, 238, 0.4);
      top: -100px; left: -100px;
    }
    .shape2 {
      width: 300px; height: 300px;
      background: rgba(247, 37, 133, 0.3);
      bottom: -50px; right: -50px;
      animation-delay: -5s;
    }

    @keyframes float {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(30px) scale(1.1); }
    }

    /* Glassmorphism Card */
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      z-index: 1;
      animation: fadeUp 0.8s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      text-align: center;
      margin-bottom: 40px;
    }
    .logo h1 {
      font-size: 2.5rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -1px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }
    .logo span {
      background: linear-gradient(90deg, #4cc9f0, #4361ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .logo p {
      color: rgba(255,255,255,0.7);
      font-size: 0.95rem;
      margin-top: 8px;
      font-weight: 300;
    }

    .form-group {
      margin-bottom: 24px;
      position: relative;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      font-size: 1rem;
      color: #fff;
      transition: all 0.3s ease;
      font-family: inherit;
    }
    input::placeholder {
      color: rgba(255,255,255,0.3);
    }
    input:focus {
      outline: none;
      border-color: #4cc9f0;
      background: rgba(0, 0, 0, 0.3);
      box-shadow: 0 0 0 3px rgba(76, 201, 240, 0.2);
    }

    button[type="submit"] {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, #4361ee, #4cc9f0);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 10px;
      font-family: inherit;
      box-shadow: 0 4px 15px rgba(67, 97, 238, 0.4);
    }
    button[type="submit"]:hover { 
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(67, 97, 238, 0.6);
    }
    button[type="submit"]:active {
      transform: translateY(0);
    }
    button[type="submit"]:disabled { 
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.5);
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .error {
      background: rgba(239, 35, 60, 0.15);
      border: 1px solid rgba(239, 35, 60, 0.3);
      color: #ff4d6d;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      display: none;
      backdrop-filter: blur(5px);
      animation: shake 0.5s;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .hint {
      text-align: center;
      margin-top: 28px;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.4);
      line-height: 1.5;
    }
    .hint span {
      color: rgba(255,255,255,0.7);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="bg-shape shape1"></div>
  <div class="bg-shape shape2"></div>

  <div class="card">
    <div class="logo">
      <h1>BITE<span>.co</span></h1>
      <p>Cloud Cost Management Platform</p>
    </div>
    <div class="error" id="errorMsg"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" placeholder="usuario@empresa.co" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <button type="submit" id="submitBtn">Iniciar Sesión</button>
    </form>
    <p class="hint">
      Demo: <span>empresa_a@bite.co</span> / BiteCo2024! (ADMIN)<br/>
      <span>analyst@bite.co</span> (ANALYST)
    </p>
  </div>

  <script>
    // Redirect to dashboard if already logged in
    if (localStorage.getItem('access_token')) {
      window.location.href = 'dashboard.html';
    }

    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // Reset animations
      errorMsg.style.animation = 'none';
      errorMsg.offsetHeight; /* trigger reflow */
      errorMsg.style.animation = null;
      
      errorMsg.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Autenticando...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const resp = await fetch(`${CONFIG.AUTH_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        const data = await resp.json();

        if (!resp.ok) {
          showError(data.error || 'Credenciales inválidas. Por favor intente nuevamente.');
          return;
        }

        localStorage.setItem('access_token', data.access_token);
        localStorage.setItem('refresh_token', data.refresh_token || '');
        localStorage.setItem('user_email', email);
        localStorage.setItem('user_rol', data.rol || 'ANALYST');
        
        // Success animation before redirect
        submitBtn.style.background = '#06d6a0';
        submitBtn.textContent = '¡Acceso Concedido!';
        
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 600);
      } catch (err) {
        showError('Error de conexión con el servidor.');
      } finally {
        if(submitBtn.textContent !== '¡Acceso Concedido!') {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Iniciar Sesión';
        }
      }
    });

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Iniciar Sesión';
    }
  </script>
</body>
</html>
